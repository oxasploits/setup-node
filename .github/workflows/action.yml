name: Setup Node.js
description: Setup Node.js environment
inputs:
  node-version:
    description: Node version to install
    required: false
    default: '20'
  cache:
    description: Package manager to cache
    required: false
    default: 'npm'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
